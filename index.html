<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الغراب والثعلب - درس تفاعلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section-btn.active { background: white; color: #7c3aed; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: scale(1.05); }
        .section-btn.completed { background: #a78bfa; color: white; }
        .verse-box { 
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
            border-right: 4px solid #8b5cf6;
        }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        @keyframes fly {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .fly-animation { animation: fly 2s ease-in-out infinite; }
        @keyframes sneak {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }
        .sneak-animation { animation: sneak 1.5s ease-in-out infinite; }
        .story-phase { transition: all 0.3s ease; }
        .story-phase:hover { transform: scale(1.02); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-purple-50 to-fuchsia-50">
    <div id="app" class="p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="bg-gradient-to-r from-violet-600 via-purple-600 to-fuchsia-600 rounded-2xl p-6 mb-6 shadow-xl">
                <h1 class="text-3xl md:text-4xl font-bold text-white text-center mb-2">
                    <span class="text-4xl">🦊</span> الغراب والثعلب <span class="text-4xl">🐦‍⬛</span>
                </h1>
                <p class="text-purple-100 text-center text-lg mb-1">حكاية من أوروبا - أمثال لافونتين</p>
                <p class="text-purple-200 text-center text-sm">الصف الخامس - الفصل الدراسي الثاني - المحور السادس: حكايات وقصص من العالم</p>
                
                <!-- Navigation -->
                <div id="nav-buttons" class="flex flex-wrap justify-center gap-2 mt-6"></div>
            </div>

            <!-- Progress Bar -->
            <div class="bg-white rounded-full h-4 mb-6 shadow-inner overflow-hidden">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-violet-400 to-purple-500 transition-all duration-500 rounded-full" style="width: 0%"></div>
            </div>

            <!-- Main Content -->
            <div id="content" class="animate-fadeIn"></div>

            <!-- Footer -->
            <div class="text-center text-gray-500 text-sm mt-8 pb-4">
               من إعداد : الأستاذ خليل البلوشي
            </div>
        </div>
    </div>

    <script>
        // Application State
        let state = {
            currentSection: 0,
            score: 0,
            completedSections: [],
            currentQuizIndex: 0,
            selectedAnswer: null,
            showResult: false,
            isCorrect: null,
            showCelebration: false,
            currentVerse: 0
        };

        // Data
        const sections = [
            { id: 0, title: 'المقدمة', icon: '📚' },
            { id: 1, title: 'القصيدة', icon: '📜' },
            { id: 2, title: 'شرح الأبيات', icon: '📖' },
            { id: 3, title: 'أحداث القصة', icon: '🎭' },
            { id: 4, title: 'التحليل الأدبي', icon: '🔍' },
            { id: 5, title: 'الاختبار', icon: '✅' },
            { id: 6, title: 'العبرة', icon: '💎' },
        ];

        // أبيات القصيدة
        const verses = [
            { num: 1, first: 'إلى دَوْحَةٍ قَدْ أَوَى مَرَّةً', second: 'غُرابٌ وَفي غُصْنِها قَدْ جَثَمْ' },
            { num: 2, first: 'وَكانَتْ بِمِنْقارِهِ جُبْنَةٌ', second: 'يَهَشُّ إلى أَكْلِها ذو النَّهَمْ' },
            { num: 3, first: 'فَوافاهُ مُسْتَرْوِحاً ثَعْلَبٌ', second: 'يُهيجُ حَشاهُ بِمِثْلِ الضَّرَمْ' },
            { num: 4, first: 'فَحَيَّا الغُرابَ وَقالَ لَهُ:', second: '"سَلامٌ أَيُّها الصَّاحِبُ المُحْتَرَمْ"' },
            { num: 5, first: 'لَعَمْري إنَّكَ باهِرُ شَكْلٍ', second: 'بَديعُ المَلامِحِ مِنْ غَيْرِ ذَمّْ' },
            { num: 6, first: 'وَريشُكَ زاهي الجَمالِ فَأَنْتَ', second: 'جَميلٌ مِنَ الرَّأْسِ حَتّى القَدَمْ' },
            { num: 7, first: 'فَلَوْ أَنَّ صَوْتَكَ ناسَبَ ريـ', second: '‍ـشَكَ حُسْناً لَكانَ لَكَ الحُسْنُ تَمّْ' },
            { num: 8, first: 'فَأَفْرَجَ مِنْقارَهُ فَإذا', second: 'بِجُبْنَتِهِ في فَمٍ أَيِّ فَمْ' },
            { num: 9, first: 'فَالْتَقَطَها ذو الدِّهاءِ سَريعاً', second: 'فَكانَتْ لَهُ مِنْ أَلَذِّ اللُّقَمْ' },
            { num: 10, first: 'فَكادَ الغُرابُ يَذوبُ حَياءً', second: 'وَأَنْشَأَ يَقْرَعُ سِنَّ النَّدَمْ' },
            { num: 11, first: 'وَأَقْسَمَ أَنْ لَنْ يُمَلَّقَ بَعْدُ', second: 'وَلكِنْ تَأَخَّرَ ذاكَ القَسَمْ' },
        ];

        // شرح الأبيات
        const verseExplanations = [
            { num: '1-2', text: 'غراب أوى إلى شجرة كبيرة (دوحة) وجلس على غصنها، وكان يحمل في منقاره قطعة جبن يتشوق لأكلها.' },
            { num: '3', text: 'جاء ثعلب جائع يبحث عن طعام، وبطنه تشتعل كالنار من شدة الجوع.' },
            { num: '4', text: 'بدأ الثعلب حيلته بالتحية والسلام على الغراب باحترام.' },
            { num: '5-6', text: 'أخذ الثعلب يمدح شكل الغراب ويصفه بالجمال البديع والريش الزاهي من رأسه حتى قدمه.' },
            { num: '7', text: 'تمنى الثعلب لو أن صوت الغراب جميل مثل شكله ليكتمل جماله.' },
            { num: '8', text: 'فتح الغراب منقاره ليُظهر صوته فسقطت الجبنة في فم الثعلب.' },
            { num: '9', text: 'التقط الثعلب الماكر الجبنة بسرعة فكانت له من ألذ اللقم.' },
            { num: '10', text: 'كاد الغراب يذوب من شدة الخجل وأخذ يشعر بالندم الشديد.' },
            { num: '11', text: 'أقسم الغراب ألا يُخدع بالمديح الكاذب مرة أخرى، لكن القسم جاء متأخراً بعد ضياع الجبنة.' },
        ];

        // مراحل القصة
        const storyPhases = [
            { 
                title: 'البداية', 
                icon: '🌳', 
                verses: '1-2',
                description: 'استعداد الغراب لتناول الجبنة على الشجرة',
                details: 'غراب يجلس على شجرة كبيرة وبمنقاره جبنة لذيذة، يأتي ثعلب جائع يريد الجبنة'
            },
            { 
                title: 'التحول', 
                icon: '🎭', 
                verses: '3-7',
                description: 'حيلة الثعلب بالمديح والتملق',
                details: 'يبدأ الثعلب بمدح الغراب: شكله الجميل، ريشه الزاهي، ويتمنى سماع صوته الجميل'
            },
            { 
                title: 'النهاية', 
                icon: '😢', 
                verses: '8-11',
                description: 'سقوط الجبنة وندم الغراب',
                details: 'يفتح الغراب منقاره ليغني فتسقط الجبنة، يلتقطها الثعلب، ويندم الغراب'

        ];

        // خطوات حيلة الثعلب
        const foxTrick = [
            { step: 1, title: 'التودد ونيل الثقة', description: 'بدأ بالسلام والتحية باحترام', icon: '👋' },
            { step: 2, title: 'المديح الكاذب', description: 'وصف الغراب بالجمال والملامح البديعة', icon: '🌟' },
            { step: 3, title: 'الطُّعم', description: 'تمنى سماع صوته الجميل ليكتمل جماله', icon: '🎵' }
        ];

        // معاني الكلمات
        const vocabulary = [
            { word: 'دوحة', meaning: 'شجرة كبيرة' },
            { word: 'جَثَم', meaning: 'جلس وأقام' },
            { word: 'مُستَرْوِحاً', meaning: 'مستريحاً / طالباً الراحة' },
            { word: 'النَّهَم', meaning: 'شدة الجوع والشَّرَه' },
            { word: 'الضَّرَم', meaning: 'النار المشتعلة' },
            { word: 'يُهيج حشاه', meaning: 'يُثير بطنه من الجوع' },
            { word: 'ذو الدِّهاء', meaning: 'صاحب المكر والحيلة (الثعلب)' },
            { word: 'يذوب حياءً', meaning: 'يشعر بخجل شديد' },
            { word: 'يقرع سنّ الندم', meaning: 'يشعر بالندم الشديد' },
            { word: 'يُمَلَّق', meaning: 'يُخدع بالمديح الكاذب' }
        ];

        const quizQuestions = [
            {
                question: 'من هو مؤلف قصة "الغراب والثعلب"؟',
                options: ['أحمد شوقي', 'لافونتين', 'المتنبي'],
                correct: 1,
                explanation: 'لافونتين (La Fontaine) كاتب وشاعر فرنسي مشهور بأمثاله وحكاياته'
            },
            {
                question: 'ماذا كان يحمل الغراب في منقاره؟',
                options: ['قطعة لحم', 'قطعة جبن', 'قطعة خبز'],
                correct: 1,
                explanation: 'كان الغراب يحمل قطعة جبن في منقاره'
            },
            {
                question: 'ما الحيلة التي استخدمها الثعلب؟',
                options: ['التهديد', 'المديح والتملق', 'الترهيب'],
                correct: 1,
                explanation: 'استخدم الثعلب حيلة المديح الكاذب والتملق لخداع الغراب'
            },
            {
                question: 'ماذا طلب الثعلب من الغراب؟',
                options: ['أن يطير', 'أن يُسمعه صوته', 'أن ينزل من الشجرة'],
                correct: 1,
                explanation: 'تمنى الثعلب أن يسمع صوت الغراب ليكتمل جماله'
            },
            {
                question: 'ما معنى "ذو الدهاء"؟',
                options: ['صاحب الجمال', 'صاحب المكر والحيلة', 'صاحب القوة'],
                correct: 1,
                explanation: 'ذو الدهاء تعني صاحب المكر والحيلة، وهو وصف للثعلب'
            },
            {
                question: 'ما معنى "يقرع سنّ الندم"؟',
                options: ['يضحك بشدة', 'يشعر بالندم الشديد', 'يأكل بسرعة'],
                correct: 1,
                explanation: 'يقرع سنّ الندم تعني يشعر بالندم الشديد على ما فعل'
            },
            {
                question: 'لماذا سقطت الجبنة من منقار الغراب؟',
                options: ['لأنه نام', 'لأنه فتح منقاره ليغني', 'لأنها ثقيلة'],
                correct: 1,
                explanation: 'سقطت الجبنة عندما فتح الغراب منقاره ليُظهر صوته للثعلب'
            },
            {
                question: 'ما العبرة المستفادة من القصة؟',
                options: ['الجبن لذيذ', 'الحذر من المديح الكاذب والمتملقين', 'الثعالب ذكية'],
                correct: 1,
                explanation: 'العبرة هي الحذر من المديح الكاذب والتملق، وعدم الانخداع بكلام المتملقين'
            }
        ];

        // Render Functions
        function renderNav() {
            const nav = document.getElementById('nav-buttons');
            nav.innerHTML = sections.map(section => `
                <button onclick="goToSection(${section.id})" 
                    class="section-btn px-3 py-2 rounded-full text-sm font-bold transition-all ${
                        state.currentSection === section.id ? 'active' : 
                        state.completedSections.includes(section.id) ? 'completed' : 'bg-white/20 text-white hover:bg-white/30'
                    }">
                    ${section.icon} ${section.title}
                </button>
            `).join('');
        }

        function updateProgress() {
            const progress = (state.completedSections.length / sections.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function goToSection(id) {
            state.currentSection = id;
            render();
        }

        function markComplete(id) {
            if (!state.completedSections.includes(id)) {
                state.completedSections.push(id);
            }
        }

        // Section Renderers
        function renderIntroduction() {
            return `
                <div class="space-y-6 animate-fadeIn">
                    <div class="bg-gradient-to-br from-violet-50 to-purple-50 rounded-2xl p-8 border-2 border-violet-200 shadow-lg">
                        <h2 class="text-3xl font-bold text-violet-800 mb-6 text-center">🌟 مرحباً بك في قصة الغراب والثعلب</h2>
                        
                        <div class="flex justify-center gap-8 mb-6">
                            <div class="text-center">
                                <div class="text-6xl fly-animation">🐦‍⬛</div>
                                <p class="text-sm text-gray-600 mt-2">الغراب</p>
                            </div>
                            <div class="text-center">
                                <div class="text-6xl sneak-animation">🦊</div>
                                <p class="text-sm text-gray-600 mt-2">الثعلب</p>
                            </div>
                        </div>

                        <!-- معلومات عن القصة -->
                        <div class="bg-white rounded-xl p-5 mb-6 border-2 border-violet-200">
                            <h3 class="text-xl font-bold text-violet-700 mb-3 flex items-center gap-2">
                                <span class="text-2xl">✍️</span> عن القصة
                            </h3>
                            <div class="bg-violet-50 rounded-lg p-4">
                                <p class="text-lg text-gray-700 mb-2"><strong>المؤلف:</strong> لافونتين (La Fontaine) - كاتب وشاعر فرنسي</p>
                                <p class="text-lg text-gray-700 mb-2"><strong>المصدر:</strong> أمثال لافونتين</p>
                                <p class="text-lg text-gray-700"><strong>الترجمة:</strong> نيقولا أبو هنا</p>
                            </div>
                        </div>

                        <div class="bg-white/80 rounded-xl p-6 mb-6">
                            <h3 class="text-xl font-bold text-violet-700 mb-4">📖 ماذا ستتعلم؟</h3>
                            <ul class="space-y-3 text-lg text-gray-700">
                                <li class="flex items-center gap-3">
                                    <span class="w-8 h-8 bg-violet-500 text-white rounded-full flex items-center justify-center text-sm font-bold">١</span>
                                    <span>قراءة القصيدة وفهم أحداثها</span>
                                </li>
                                <li class="flex items-center gap-3">
                                    <span class="w-8 h-8 bg-violet-500 text-white rounded-full flex items-center justify-center text-sm font-bold">٢</span>
                                    <span>تحليل شخصيتي الغراب والثعلب</span>
                                </li>
                                <li class="flex items-center gap-3">
                                    <span class="w-8 h-8 bg-violet-500 text-white rounded-full flex items-center justify-center text-sm font-bold">٣</span>
                                    <span>فهم حيلة الثعلب وخطواتها</span>
                                </li>
                                <li class="flex items-center gap-3">
                                    <span class="w-8 h-8 bg-violet-500 text-white rounded-full flex items-center justify-center text-sm font-bold">٤</span>
                                    <span>استخراج العبرة من القصة</span>
                                </li>
                            </ul>
                        </div>

                        <div class="bg-gradient-to-r from-amber-100 to-yellow-100 rounded-xl p-5 border-2 border-amber-300">
                            <h4 class="text-lg font-bold text-amber-700 mb-2 flex items-center gap-2">
                                <span class="text-2xl">💡</span> الفكرة العامة
                            </h4>
                            <p class="text-gray-700">
                                قصة رمزية على لسان الحيوانات، تحكي عن <strong>ثعلب ماكر</strong> خدع <strong>غراباً مغروراً</strong> 
                                بالمديح الكاذب حتى حصل على جبنته. والعبرة: <strong class="text-red-600">الحذر من المتملقين</strong>.
                            </p>
                        </div>
                    </div>
                    
                    <button onclick="markComplete(0); goToSection(1);" class="w-full py-4 bg-gradient-to-r from-violet-500 to-purple-500 text-white text-xl font-bold rounded-xl hover:from-violet-600 hover:to-purple-600 transition-all transform hover:scale-[1.02] shadow-lg">
                        اقرأ القصيدة ←
                    </button>
                </div>
            `;
        }

        function renderPoem() {
            return `
                <div class="space-y-6 animate-fadeIn">
                    <div class="bg-gradient-to-br from-purple-50 to-fuchsia-50 rounded-2xl p-6 border-2 border-purple-200">
                        <h2 class="text-2xl font-bold text-purple-800 mb-6 text-center">📜 قصيدة الغراب والثعلب</h2>
                        
                        <div class="space-y-3">
                            ${verses.map(v => `
                                <div class="verse-box rounded-xl p-4 card-hover">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="bg-purple-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">${v.num}</span>
                                        ${v.note ? `<span class="text-xs text-purple-600">${v.note}</span>` : ''}
                                    </div>
                                    <div class="grid md:grid-cols-2 gap-4">
                                        <p class="text-lg text-gray-800 font-bold text-center md:text-right">${v.first}</p>
                                        <p class="text-lg text-gray-800 font-bold text-center md:text-right">${v.second}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-6 bg-violet-100 rounded-xl p-4 border-2 border-violet-300">
                            <p class="text-center text-violet-700 font-bold">
                                📚 من أمثال لافونتين - ترجمة: نيقولا أبو هنا
                            </p>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="goToSection(0)" class="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition-all">→ السابق</button>
                        <button onclick="markComplete(1); goToSection(2);" class="flex-1 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 text-white font-bold rounded-xl hover:from-purple-600 hover:to-fuchsia-600 transition-all">شرح الأبيات ←</button>
                    </div>

        }

        function renderExplanation() {
            return `
                <div class="space-y-6 animate-fadeIn">
                    <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-6 border-2 border-blue-200">
                        <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">📖 شرح الأبيات ومعاني الكلمات</h2>
                        
                        <!-- شرح الأبيات -->
                        <div class="space-y-4 mb-6">
                            ${verseExplanations.map(exp => `
                                <div class="bg-white rounded-xl p-4 border-2 border-blue-200 card-hover">
                                    <div class="flex items-center gap-2 mb-2">

                            `).join('')}

                        <!-- معاني الكلمات -->
                        <div class="bg-gradient-to-r from-amber-100 to-yellow-100 rounded-xl p-5 border-2 border-amber-300">

                            <div class="grid md:grid-cols-2 gap-3">
                                ${vocabulary.map(v => `
                                    <div class="bg-white rounded-lg p-3 flex items-center gap-3">
                                        <span class="bg-amber-500 text-white px-2 py-1 rounded font-bold text-sm">${v.word}</span>

                            </div>

                    </div>

                            </div>
                        </div>

                        <div class="mt-6 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-xl p-6 text-center">
                            <div class="text-4xl mb-2">🎉</div>
                            <h3 class="text-xl font-bold mb-2">تهانينا! أكملت الدرس بنجاح</h3>
                            <p>تعلمت قصة الغراب والثعلب واستخرجت العبرة منها</p>
                        </div>
                    </div>

                    <button onclick="markComplete(6); resetQuiz(); goToSection(0);" class="w-full py-4 bg-gradient-to-r from-teal-500 to-cyan-500 text-white text-xl font-bold rounded-xl hover:from-teal-600 hover:to-cyan-600 transition-all">
                        العودة للبداية 🔄
                    </button>
                </div>
            `;
        }

        function render() {
            renderNav();
            updateProgress();
            
            const content = document.getElementById('content');
            switch(state.currentSection) {
                case 0: content.innerHTML = renderIntroduction(); break;
                case 1: content.innerHTML = renderPoem(); break;
                case 2: content.innerHTML = renderExplanation(); break;
                case 3: content.innerHTML = renderStoryEvents(); break;
                case 4: content.innerHTML = renderAnalysis(); break;
                case 5: content.innerHTML = renderQuiz(); break;
                case 6: content.innerHTML = renderLesson(); break;
                default: content.innerHTML = renderIntroduction();
            }
        }

        // Initialize
        render();
    </script>
</body>
</html>
